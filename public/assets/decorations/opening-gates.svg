<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" fill="none">
  <defs>
    <linearGradient id="gate-left" x1="120" y1="450" x2="450" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff8f5"/>
      <stop offset="1" stop-color="#efd8dc"/>
    </linearGradient>
    <linearGradient id="gate-right" x1="780" y1="450" x2="450" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff8f5"/>
      <stop offset="1" stop-color="#efd8dc"/>
    </linearGradient>
    <linearGradient id="gate-metal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8e8c4"/>
      <stop offset=".5" stop-color="#d8a85a"/>
      <stop offset="1" stop-color="#fff1c7"/>
    </linearGradient>
  </defs>
  <style>
    .gate-leaf {
      transform-box: fill-box;
      animation-duration: 6600ms;
      animation-timing-function: cubic-bezier(.22, 1, .36, 1);
      animation-fill-mode: both;
    }
    .gate-leaf-left {
      transform-origin: right center;
      animation-name: gate-open-left;
    }
    .gate-leaf-right {
      transform-origin: left center;
      animation-name: gate-open-right;
    }
    @keyframes gate-open-left {
      0%, 14% { transform: translateX(0); opacity: 1; }
      46%, 100% { transform: translateX(-100%); opacity: .18; }
    }
    @keyframes gate-open-right {
      0%, 14% { transform: translateX(0); opacity: 1; }
      46%, 100% { transform: translateX(100%); opacity: .18; }
    }
    @media (prefers-reduced-motion: reduce) {
      .gate-leaf { animation: none !important; }
    }
  </style>

